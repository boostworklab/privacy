<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End User License Agreement (EULA) | CoordiPro</title>
    <meta name="description" content="End User License Agreement (EULA) and Terms of Service for CoordiPro — Professional AutoCAD Shipbuilding Coordinate Annotation Tool by BoostWorkLab.">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --nord0: #2E3440;
            --nord1: #3B4252;
            --nord2: #434C5E;
            --nord3: #4C566A;
            --nord4: #D8DEE9;
            --nord5: #E5E9F0;
            --nord6: #ECEFF4;
            --nord7: #8FBCBB;
            --nord8: #88C0D0;
            --nord9: #81A1C1;
            --nord10: #5E81AC;
            --nord11: #BF616A;
            --nord12: #D08770;
            --nord13: #EBCB8B;
            --nord14: #A3BE8C;
            --nord15: #B48EAD;
            --bg-page: #0f141c;
            --bg-card: #181f2a;
            --bg-card-header: #202938;
            --border-subtle: #2b3648;
            --border-focus: #88C0D0;
            --text-primary: #F0F4F8;
            --text-secondary: #9AA6B8;
            --text-muted: #6B7A90;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.65;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Top Navigation Header */
        header {
            background-color: rgba(24, 31, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--nord6);
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.02em;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--nord8), var(--nord10));
            color: var(--nord0);
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .nav-links a:hover {
            color: var(--nord8);
        }

        .nav-links a.active {
            color: var(--nord8);
            font-weight: 600;
        }

        /* Main Document Wrapper */
        .page-wrapper {
            max-width: 960px;
            margin: 40px auto 80px auto;
            padding: 0 24px;
        }

        /* Document Header Card */
        .doc-header {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 36px 40px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .doc-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--nord8), var(--nord9), var(--nord10));
        }

        .doc-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--nord6);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .doc-subtitle {
            font-size: 16px;
            color: var(--nord8);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .doc-metadata {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-subtle);
            padding-top: 18px;
        }

        .doc-metadata strong {
            color: var(--nord4);
        }

        /* Important Notice Banner */
        .notice-banner {
            background: rgba(191, 97, 106, 0.08);
            border: 1px solid rgba(191, 97, 106, 0.4);
            border-left: 4px solid var(--nord11);
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 32px;
        }

        .notice-banner h3 {
            color: var(--nord11);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notice-banner p {
            color: var(--nord5);
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.6;
        }

        /* Document Body & Sections */
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 40px;
        }

        .section-block {
            margin-bottom: 36px;
        }

        .section-block:last-child {
            margin-bottom: 0;
        }

        .section-heading {
            font-size: 18px;
            font-weight: 700;
            color: var(--nord6);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .section-number {
            color: var(--nord8);
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 600;
        }

        p {
            margin-bottom: 14px;
            color: var(--nord4);
            font-size: 14.5px;
        }

        p:last-child {
            margin-bottom: 0;
        }

        /* Numbered & Bullet Lists */
        ol, ul {
            padding-left: 22px;
            margin-bottom: 14px;
            color: var(--nord4);
        }

        li {
            margin-bottom: 10px;
            font-size: 14.5px;
            line-height: 1.65;
        }

        li strong {
            color: var(--nord6);
        }

        /* Callout Boxes */
        .callout-warning {
            background: rgba(235, 203, 139, 0.08);
            border: 1px solid rgba(235, 203, 139, 0.35);
            border-left: 4px solid var(--nord13);
            border-radius: 8px;
            padding: 18px 22px;
            margin: 16px 0;
        }

        .callout-warning .callout-title {
            color: var(--nord13);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .callout-danger {
            background: rgba(191, 97, 106, 0.08);
            border: 1px solid rgba(191, 97, 106, 0.35);
            border-left: 4px solid var(--nord11);
            border-radius: 8px;
            padding: 18px 22px;
            margin: 16px 0;
        }

        .callout-danger .callout-title {
            color: var(--nord11);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .legal-allcaps {
            text-transform: uppercase;
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--nord5);
            letter-spacing: 0.02em;
        }

        a {
            color: var(--nord8);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s ease;
        }

        a:hover {
            color: var(--nord7);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-subtle);
            padding: 32px 24px;
            background: var(--bg-card);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-content {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .footer-links {
            display: flex;
            gap: 18px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-links a:hover {
            color: var(--nord8);
        }

        /* Print Media Styles */
        @media print {
            body {
                background: #ffffff;
                color: #111111;
                font-size: 12pt;
            }
            header, footer, .nav-links {
                display: none;
            }
            .page-wrapper {
                margin: 0;
                padding: 0;
                max-width: 100%;
            }
            .doc-header, .content-card, .notice-banner, .callout-warning, .callout-danger {
                background: transparent !important;
                border: 1px solid #cccccc !important;
                color: #000000 !important;
                box-shadow: none !important;
            }
            .section-heading {
                color: #000000 !important;
                border-bottom: 1px solid #cccccc !important;
            }
            a {
                color: #000000 !important;
                text-decoration: underline;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">

                <a href="mailto:support@boostworklab.com">Support</a>
            </nav>
        </div>
    </header>

    <main class="page-wrapper">
